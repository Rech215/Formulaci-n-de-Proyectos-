name: eduguia_app
description: Aplicación móvil EduGuía migrada a Flutter con Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^11.2.0
  purchases_flutter: ^11.0.1
  flutter_dotenv: ^6.0.1
  get_it: ^9.3.0
  image_cropper: ^13.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/

flutter_native_splash:
  color: "#0F172A"
  image: assets/branding/splash_logo.png
  color_dark: "#020617"
  image_dark: assets/branding/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#0F172A"
    image: assets/branding/splash_logo.png
    color_dark: "#020617"
    image_dark: assets/branding/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21
