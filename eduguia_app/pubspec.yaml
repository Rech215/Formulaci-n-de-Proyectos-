name: eduguia_app
description: Aplicación móvil EduGuía migrada a Flutter con Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^11.2.0
  purchases_flutter: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
