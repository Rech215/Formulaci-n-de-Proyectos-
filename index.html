<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGuía - Acompaña a tu hijo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
                            400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
                            800: '#115e59', 900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-slate-800 antialiased bg-slate-50">
    
    <!-- Aquí se inyectará el NavbarComponent -->
    <div id="navbar"></div>

    <!-- Aquí el Router inyectará las vistas dinámicas (/inicio, /problema, etc.) -->
    <main id="app" class="min-h-screen pt-20 transition-opacity duration-200"></main>

    <!-- Aquí se inyectará el FooterComponent -->
    <div id="footer"></div>

    <!-- Entrada TypeScript procesada por Vite -->
    <script type="module" src="/src/app.ts"></script>
</body>
</html>
